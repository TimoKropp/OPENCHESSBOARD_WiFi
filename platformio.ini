; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs =
	arduino_nano_esp32

[env]
framework = arduino
monitor_speed = 115200

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
upload_protocol = dfu
board_flash_size = 8MB
board_build.partitions = partitions.csv
build_flags =
	-std=c++2a
	-std=gnu++2a
	-D LOG_LVL_INFO ; Levels: TRACE, DEBUG, INFO, WARNING, ERROR, DISABLED
	; -D LOG_FORMAT_WITHOUT_PREFIX
	; -D MANUAL_MOVE_INPUT
	; -D PLUG_AT_TOP ; Not fully supported yet
build_unflags =
	-std=gnu++11
extra_scripts = pre:scripts/convert_html_to_string.py, post:scripts/publish_firmware.py
lib_deps =
	vovagorodok/ArduinoBleChess@^0.7.9
	vovagorodok/ArduinoBleOTA@^2.0.11
	vovagorodok/ArduinoStreamLogger@^1.3.3
	h2zero/NimBLE-Arduino@^1.4.3
	bblanchon/ArduinoJson@^7.4.3
